<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Celulares - Sistema de Celulares</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .main-card { max-width: 1200px; margin: 40px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="container-fluid px-4">
    <div class="card main-card p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="text-success fw-bold mb-0" th:text="${tituloReporte != null ? tituloReporte : 'Listado de Celulares'}">Listado de Celulares</h3>
            <div>
                <a th:href="@{/celulares/nuevo}" class="btn btn-success me-2">➕ Agregar Celular</a>
                <a th:href="@{/}" class="btn btn-secondary">🏠 Inicio</a>
            </div>
        </div>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle style-sm">
                <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>IMEI</th>
                    <th>Pantalla</th>
                    <th>RAM</th>
                    <th>Alm. P.</th>
                    <th>SO</th>
                    <th>Operador</th>
                    <th>Cámaras</th>
                    <th>CPU</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${celulares}">
                    <td th:text="${c.id}">id</td>
                    <td th:text="${c.marca}">marca</td>
                    <td th:text="${c.imei}">imei</td>
                    <td th:text="${c.pulgadas + '&quot;'}">pulgadas</td>
                    <td th:text="${c.ram}">ram</td>
                    <td th:text="${c.almacenamientoPrincipal}">almP</td>
                    <td th:text="${c.sistemaOperativo}">so</td>
                    <td th:text="${c.operador}">operador</td>
                    <td th:text="${c.camaras}">camaras</td>
                    <td th:text="${c.marcaCpu}">cpu</td>
                    <td class="text-center">
                        <a th:href="@{/celulares/editar/{id}(id=${c.id})}" class="btn btn-warning btn-sm me-1">✏️ Editar</a>
                        <a th:href="@{/celulares/eliminar/{id}(id=${c.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro de eliminar este celular?');">🗑️ Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(celulares)}">
                    <td colspan="11" class="text-center text-muted py-3">No se encontraron registros de celulares.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
