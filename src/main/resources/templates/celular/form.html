<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Celular - Sistema de Celulares</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .main-card { max-width: 900px; margin: 40px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="container">
    <div class="card main-card p-4 bg-white">
        <h3 class="text-success fw-bold mb-4" th:text="${accion == 'editar' ? 'Editar Celular' : 'Agregar Nuevo Celular'}">Formulario Celular</h3>

        <form th:action="@{/celulares/guardar}" th:object="${celular}" method="post" class="row g-3">
            <div class="col-md-4">
                <label for="id" class="form-label">ID Celular</label>
                <input type="text" id="id" th:field="*{id}" class="form-control" required th:readonly="${accion == 'editar'}">
            </div>
            <div class="col-md-4">
                <label for="marca" class="form-label">Marca</label>
                <input type="text" id="marca" th:field="*{marca}" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label for="imei" class="form-label">IMEI</label>
                <input type="text" id="imei" th:field="*{imei}" class="form-control" required>
            </div>

            <div class="col-md-3">
                <label for="pulgadas" class="form-label">Pulgadas</label>
                <input type="text" id="pulgadas" th:field="*{pulgadas}" class="form-control" required placeholder="Ej: 6.5">
            </div>
            <div class="col-md-3">
                <label for="megapixeles" class="form-label">Megapíxeles</label>
                <input type="text" id="megapixeles" th:field="*{megapixeles}" class="form-control" required placeholder="Ej: 48MP">
            </div>
            <div class="col-md-3">
                <label for="ram" class="form-label">Memoria RAM</label>
                <input type="text" id="ram" th:field="*{ram}" class="form-control" required placeholder="Ej: 8GB">
            </div>
            <div class="col-md-3">
                <label for="almacenamientoPrincipal" class="form-label">Almacenamiento Principal</label>
                <input type="text" id="almacenamientoPrincipal" th:field="*{almacenamientoPrincipal}" class="form-control" required placeholder="Ej: 128GB">
            </div>

            <div class="col-md-3">
                <label for="almacenamientoSecundario" class="form-label">Almacenamiento Secundario</label>
                <input type="text" id="almacenamientoSecundario" th:field="*{almacenamientoSecundario}" class="form-control" required placeholder="Ej: SD 256GB / 0GB">
            </div>
            <div class="col-md-3">
                <label for="sistemaOperativo" class="form-label">Sistema Operativo</label>
                <input type="text" id="sistemaOperativo" th:field="*{sistemaOperativo}" class="form-control" required placeholder="Ej: Android 13 / iOS">
            </div>
            <div class="col-md-3">
                <label for="operador" class="form-label">Operador</label>
                <input type="text" id="operador" th:field="*{operador}" class="form-control" required placeholder="Ej: Claro, Movistar, Libre">
            </div>
            <div class="col-md-3">
                <label for="tecnologiaBanda" class="form-label">Tecnología Banda</label>
                <input type="text" id="tecnologiaBanda" th:field="*{tecnologiaBanda}" class="form-control" required placeholder="Ej: 5G / 4G LTE">
            </div>

            <div class="col-md-3">
                <label for="wifi" class="form-label">WiFi</label>
                <select id="wifi" th:field="*{wifi}" class="form-select" required>
                    <option value="Si">Sí</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="bluetooth" class="form-label">Bluetooth</label>
                <select id="bluetooth" th:field="*{bluetooth}" class="form-select" required>
                    <option value="Si">Sí</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="camaras" class="form-label">Cantidad Cámaras</label>
                <input type="text" id="camaras" th:field="*{camaras}" class="form-control" required placeholder="Ej: 3 cámaras">
            </div>
            <div class="col-md-3">
                <label for="marcaCpu" class="form-label">Marca CPU</label>
                <input type="text" id="marcaCpu" th:field="*{marcaCpu}" class="form-control" required placeholder="Ej: Snapdragon, Exynos, Bionic">
            </div>

            <div class="col-md-3">
                <label for="velocidadCpu" class="form-label">Velocidad CPU</label>
                <input type="text" id="velocidadCpu" th:field="*{velocidadCpu}" class="form-control" required placeholder="Ej: 2.84 GHz">
            </div>
            <div class="col-md-2">
                <label for="nfc" class="form-label">NFC</label>
                <select id="nfc" th:field="*{nfc}" class="form-select" required>
                    <option value="Si">Sí</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="huella" class="form-label">Lector Huella</label>
                <select id="huella" th:field="*{huella}" class="form-select" required>
                    <option value="Si">Sí</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="ir" class="form-label">Puerto Infrarrojo (IR)</label>
                <select id="ir" th:field="*{ir}" class="form-select" required>
                    <option value="Si">Sí</option>
                    <option value="No">No</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="resisteAgua" class="form-label">Resistente Agua</label>
                <select id="resisteAgua" th:field="*{resisteAgua}" class="form-select" required>
                    <option value="Si">Sí</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="cantidadSim" class="form-label">Cantidad SIM</label>
                <input type="text" id="cantidadSim" th:field="*{cantidadSim}" class="form-control" required placeholder="Ej: 2 SIM / 1 Dual">
            </div>

            <div class="col-12 d-flex justify-content-between mt-4">
                <a th:href="@{/celulares}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Guardar Celular</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
