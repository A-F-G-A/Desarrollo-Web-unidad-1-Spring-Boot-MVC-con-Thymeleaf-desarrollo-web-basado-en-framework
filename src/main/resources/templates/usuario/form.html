<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Usuario - Sistema de Celulares</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .main-card { max-width: 600px; margin: 40px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="container">
    <div class="card main-card p-4 bg-white">
        <h3 class="text-primary fw-bold mb-4" th:text="${accion == 'editar' ? 'Editar Usuario' : 'Agregar Nuevo Usuario'}">Formulario Usuario</h3>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
            <div class="mb-3">
                <label for="id" class="form-label">ID / Usuario</label>
                <input type="text" id="id" th:field="*{id}" class="form-control" required th:readonly="${accion == 'editar'}">
            </div>

            <div class="mb-3">
                <label for="clave" class="form-label">Contraseña</label>
                <input type="password" id="clave" th:field="*{clave}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="rol" class="form-label">Rol</label>
                <select id="rol" th:field="*{rol}" class="form-select" required>
                    <option value="">Seleccione...</option>
                    <option value="admin">Administrador</option>
                    <option value="usuario">Usuario Estándar</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar Usuario</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
