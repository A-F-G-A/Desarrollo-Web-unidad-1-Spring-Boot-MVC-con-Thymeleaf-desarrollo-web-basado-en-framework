<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes Parametrizados de Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .main-card { max-width: 750px; margin: 40px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="container">
    <div class="card main-card p-4 bg-white">
        <h3 class="text-primary fw-bold mb-4">Reportes Parametrizados de Usuarios</h3>

        <!-- Reporte 1: Buscar por Rol -->
        <div class="card mb-4 border-info">
            <div class="card-header bg-info text-white fw-bold">Reporte 1: Buscar por Rol</div>
            <div class="card-body">
                <form th:action="@{/usuarios/reporte/rol}" method="get">
                    <div class="mb-3">
                        <label for="rol" class="form-label">Seleccione el Rol:</label>
                        <select id="rol" name="rol" class="form-select" required>
                            <option value="">Seleccione...</option>
                            <option value="admin">Administrador (admin)</option>
                            <option value="usuario">Usuario Estándar (usuario)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-info text-white">Generar Reporte por Rol</button>
                </form>
            </div>
        </div>

        <!-- Reporte 2: Buscar por Nombre -->
        <div class="card mb-4 border-primary">
            <div class="card-header bg-primary text-white fw-bold">Reporte 2: Buscar por Coincidencia de Nombre</div>
            <div class="card-body">
                <form th:action="@{/usuarios/reporte/nombre}" method="get">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre o Fragmento:</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Juan, Maria, Admin" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Generar Reporte por Nombre</button>
                </form>
            </div>
        </div>

        <div class="text-center">
            <a th:href="@{/}" class="btn btn-secondary">🏠 Volver al Inicio</a>
        </div>
    </div>
</div>
</body>
</html>
