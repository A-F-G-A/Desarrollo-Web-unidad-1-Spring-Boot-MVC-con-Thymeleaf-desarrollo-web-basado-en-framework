<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Usuarios - Sistema de Celulares</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .main-card { max-width: 1000px; margin: 40px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="container">
    <div class="card main-card p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="text-primary fw-bold mb-0" th:text="${tituloReporte != null ? tituloReporte : 'Listado de Usuarios'}">Listado de Usuarios</h3>
            <div>
                <a th:href="@{/usuarios/nuevo}" class="btn btn-success me-2">➕ Agregar Usuario</a>
                <a th:href="@{/}" class="btn btn-secondary">🏠 Inicio</a>
            </div>
        </div>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Rol</th>
                    <th>Email</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}">id</td>
                    <td th:text="${u.nombre}">nombre</td>
                    <td>
                        <span class="badge" th:classappend="${u.rol == 'admin' ? 'bg-danger' : 'bg-info'}" th:text="${u.rol}">rol</span>
                    </td>
                    <td th:text="${u.email}">email</td>
                    <td class="text-center">
                        <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-warning btn-sm me-1">✏️ Editar</a>
                        <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Está seguro de eliminar este usuario?');">🗑️ Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="5" class="text-center text-muted py-3">No se encontraron registros de usuarios.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
