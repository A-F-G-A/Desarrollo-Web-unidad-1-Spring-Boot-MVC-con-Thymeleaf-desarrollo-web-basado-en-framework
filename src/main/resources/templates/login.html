<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Sistema de Celulares</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .card-login { max-width: 420px; margin: 100px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
<div class="container">
    <div class="card card-login p-4 bg-white">
        <h3 class="text-center mb-4 text-primary fw-bold">Iniciar Sesión</h3>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="id" class="form-label">ID de Usuario</label>
                <input type="text" id="id" name="id" class="form-control" required placeholder="Ej: admin">
            </div>
            <div class="mb-3">
                <label for="clave" class="form-label">Contraseña</label>
                <input type="password" id="clave" name="clave" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Ingresar</button>
        </form>
        <div class="text-center mt-3">
            <a th:href="@{/recuperar}" class="text-decoration-none">¿Olvidó su contraseña?</a>
        </div>
    </div>
</div>
</body>
</html>
