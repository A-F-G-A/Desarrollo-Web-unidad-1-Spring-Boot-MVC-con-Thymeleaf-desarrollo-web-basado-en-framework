# Configuración de Base de Datos MySQL (Desarrollo Local / Fallback)
# En producción, estas propiedades son sobrescritas por variables de entorno (DB_URL, DB_USER, DB_PASSWORD o MYSQLHOST, MYSQLUSER, MYSQLPASSWORD)
db.url=jdbc:mysql://localhost:3306/desarrollo_web?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.usuario=root
db.password=

# Configuración de Correo (para recuperación de contraseña)
# En producción, estas propiedades son sobrescritas por variables de entorno (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD)
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.user=tu_correo@gmail.com
mail.smtp.password=tu_app_password
