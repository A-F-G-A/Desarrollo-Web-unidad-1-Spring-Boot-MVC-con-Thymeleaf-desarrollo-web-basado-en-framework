spring.application.name=desarrollo-web-celulares

# Servidor
server.port=8080

# DataSource MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/desarrollo_web?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:[REDACTED_DB_PASSWORD]}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mail SMTP Config (Gmail)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:${MAIL_USER:[REDACTED_EMAIL]}}
spring.mail.password=${SMTP_PASSWORD:${MAIL_PASSWORD:[REDACTED_APP_PASSWORD]}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Thymeleaf Cache (desactivado para desarrollo)
spring.thymeleaf.cache=false
